<!DOCTYPE html>
<html class="light" lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>🎮 AutoGamer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    body{font-family:var(--font-sans);background:var(--surface-base);color:var(--text-primary);min-height:100vh}
    .layout{display:flex;min-height:100vh}
    .sidebar{width:240px;background:var(--surface-primary);box-shadow:var(--shadow-lifted-card);display:flex;flex-direction:column;padding:var(--space-4);gap:var(--space-2);position:fixed;top:0;right:0;bottom:0;z-index:10}
    .sidebar-logo{font-size:20px;font-weight:700;padding:var(--space-3) var(--space-2);margin-bottom:var(--space-2);display:flex;align-items:center;gap:var(--space-2)}
    .nav-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);cursor:pointer;font-size:14px;font-weight:500;color:var(--text-secondary);transition:all var(--transition-fast);border:none;background:transparent;width:100%;text-align:right}
    .nav-item:hover{background:var(--surface-hover);color:var(--text-primary)}
    .nav-item.active{background:var(--surface-active);color:var(--text-primary)}
    .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:var(--space-2)}
    .main{margin-right:240px;flex:1;padding:var(--space-6)}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6)}
    .page-title{font-size:22px;font-weight:700}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-4);margin-bottom:var(--space-6)}
    .stat-card{background:var(--surface-primary);border-radius:var(--radius-xl);box-shadow:var(--shadow-lifted-card);padding:var(--space-5)}
    .stat-icon{font-size:24px;margin-bottom:var(--space-2)}
    .stat-label{font-size:12px;color:var(--text-muted);font-weight:500;margin-bottom:var(--space-2)}
    .stat-value{font-size:32px;font-weight:700}
    .table-card{background:var(--surface-primary);border-radius:var(--radius-xl);box-shadow:var(--shadow-lifted-card);overflow:hidden;margin-bottom:var(--space-4)}
    .table-header{padding:var(--space-4) var(--space-5);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-subtle)}
    .table-title{font-size:15px;font-weight:600}
    table{width:100%;border-collapse:collapse}
    th{padding:var(--space-3) var(--space-4);text-align:right;font-size:12px;font-weight:600;color:var(--text-muted);background:var(--surface-secondary)}
    td{padding:var(--space-3) var(--space-4);font-size:13px;color:var(--text-secondary);border-bottom:1px solid var(--border-subtle)}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:var(--surface-hover)}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:var(--surface-primary);border-radius:var(--radius-xl);box-shadow:0 20px 60px rgba(0,0,0,0.2);padding:var(--space-6);width:560px;max-width:95vw;max-height:90vh;overflow-y:auto}
    .modal-title{font-size:18px;font-weight:700;margin-bottom:var(--space-4)}
    .form-group{margin-bottom:var(--space-4)}
    .form-label{font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:var(--space-2);display:block}
    select,.input{width:100%;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--surface-primary);color:var(--text-primary);font-size:14px;font-family:var(--font-sans);outline:none;transition:border-color var(--transition-fast)}
    select:focus,.input:focus{border-color:var(--border-focus)}
    .modal-actions{display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-5)}
    .toast{position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%) translateY(100px);background:var(--text-primary);color:var(--text-inverse);padding:var(--space-3) var(--space-5);border-radius:var(--radius-xl);font-size:14px;font-weight:500;z-index:200;transition:transform var(--transition-medium);white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .login-card{background:var(--surface-primary);border-radius:var(--radius-xl);box-shadow:var(--shadow-lifted-card);padding:var(--space-8);width:360px;text-align:center}
    .login-logo{font-size:48px;margin-bottom:var(--space-4)}
    .login-title{font-size:20px;font-weight:700;margin-bottom:var(--space-2)}
    .login-sub{font-size:14px;color:var(--text-muted);margin-bottom:var(--space-6)}
    .page{display:none}
    .page.active{display:block}
    .search-bar{display:flex;gap:var(--space-3);margin-bottom:var(--space-4)}
    .search-bar .input{flex:1}
    .loading{text-align:center;padding:var(--space-8);color:var(--text-muted)}
    .level-btn{padding:6px 14px;border-radius:var(--radius-md);border:1px solid var(--border-default);cursor:pointer;font-size:13px;font-weight:600;background:var(--surface-secondary);transition:all .15s}
    .level-btn:hover{background:var(--blue-100);border-color:var(--blue-400)}
    .level-btn.stamped{background:#d1fae5;border-color:#6ee7b7;color:#065f46;cursor:default}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-bottom:var(--space-4)}
    .info-item{background:var(--surface-secondary);border-radius:var(--radius-md);padding:var(--space-3)}
    .info-key{font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:4px}
    .info-val{font-size:13px;font-weight:500;word-break:break-all}
    .levels-grid{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-2)}
    .balance-badge{display:inline-flex;align-items:center;gap:4px;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
    .status-badge{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
    .status-pending{background:#fef3c7;color:#92400e}
    .status-completed{background:#d1fae5;color:#065f46}
    .quick-btns{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2)}
    .quick-btn{padding:4px 12px;border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--surface-secondary);cursor:pointer;font-size:13px;font-weight:500}
    .quick-btn:hover{background:var(--surface-hover)}
  </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">🎮</div>
    <div class="login-title">AutoGamer Dashboard</div>
    <div class="login-sub">أدخل مفتاح الأدمن للدخول</div>
    <div class="form-group">
      <input type="password" class="input" id="apiKeyInput" placeholder="Admin Key" style="text-align:center"/>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">دخول →</button>
    <div id="loginError" style="color:var(--red-600);font-size:13px;margin-top:var(--space-3);display:none">❌ مفتاح خاطئ</div>
  </div>
</div>

<div id="dashboard" style="display:none">
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-logo">🎮 <span>AutoGamer</span></div>
      <button class="nav-item active" onclick="showPage('overview',this)">📊 <span>نظرة عامة</span></button>
      <button class="nav-item" onclick="showPage('orders',this)">📋 <span>الطلبات</span></button>
      <button class="nav-item" onclick="showPage('users',this)">👥 <span>المستخدمون</span></button>
      <button class="nav-item" onclick="showPage('topups',this)">💳 <span>طلبات الشحن</span></button>
      <button class="nav-item" onclick="showPage('balance',this)">💵 <span>إضافة رصيد</span></button>
      <div class="sidebar-bottom">
        <button class="theme-toggle nav-item" style="width:100%;justify-content:flex-start;gap:var(--space-3)">
          <svg class="icon-sun" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
          <svg class="icon-moon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <span>الوضع الليلي</span>
        </button>
        <button class="nav-item" onclick="logout()" style="color:var(--red-600)">🚪 <span>خروج</span></button>
      </div>
    </nav>

    <main class="main">

      <!-- Overview -->
      <div id="page-overview" class="page active">
        <div class="page-header">
          <div class="page-title">📊 نظرة عامة</div>
          <button class="btn btn-secondary btn-sm" onclick="loadOverview()">🔄 تحديث</button>
        </div>
        <div class="stats-grid" id="statsGrid"><div class="loading">جاري التحميل...</div></div>
        <div class="table-card">
          <div class="table-header"><div class="table-title">📋 آخر الطلبات</div></div>
          <div id="recentOrders"><div class="loading">جاري التحميل...</div></div>
        </div>
      </div>

      <!-- Orders -->
      <div id="page-orders" class="page">
        <div class="page-header"><div class="page-title">📋 الطلبات</div></div>
        <div class="search-bar"><input class="input" id="orderSearch" placeholder="🔍 بحث باسم أو لعبة..." oninput="filterOrders()"/></div>
        <div class="table-card"><div id="ordersTable"><div class="loading">جاري التحميل...</div></div></div>
      </div>

      <!-- Users -->
      <div id="page-users" class="page">
        <div class="page-header"><div class="page-title">👥 المستخدمون</div></div>
        <div class="search-bar"><input class="input" id="userSearch" placeholder="🔍 بحث..." oninput="filterUsers()"/></div>
        <div class="table-card"><div id="usersTable"><div class="loading">جاري التحميل...</div></div></div>
      </div>

      <!-- Balance -->
      <div id="page-balance" class="page">
        <div class="page-header"><div class="page-title">💵 إضافة رصيد</div></div>
        <div class="table-card" style="padding:var(--space-6);max-width:520px">
          <div class="form-group">
            <label class="form-label">👤 المستخدم</label>
            <select id="balanceUser" onchange="showUserBalance()"><option value="">-- اختر مستخدم --</option></select>
            <div id="currentBalanceDisplay" style="margin-top:var(--space-2);font-size:13px;color:var(--text-muted)"></div>
          </div>
          <div class="form-group">
            <label class="form-label">💰 المبلغ بالدولار</label>
            <input type="number" class="input" id="balanceAmount" placeholder="5.00" step="0.01"/>
            <div class="quick-btns">
              <button class="quick-btn" onclick="setAmount(1)">+$1</button>
              <button class="quick-btn" onclick="setAmount(2)">+$2</button>
              <button class="quick-btn" onclick="setAmount(5)">+$5</button>
              <button class="quick-btn" onclick="setAmount(10)">+$10</button>
              <button class="quick-btn" onclick="setAmount(20)">+$20</button>
              <button class="quick-btn" onclick="setAmount(50)">+$50</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">📝 ملاحظة (اختياري)</label>
            <input type="text" class="input" id="balanceNote" placeholder="مثال: مكافأة"/>
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="doAddBalance()">💵 إضافة وإرسال إشعار</button>
        </div>
      </div>


      <!-- Topups -->
      <div id="page-topups" class="page">
        <div class="page-header">
          <div class="page-title">💳 طلبات الشحن</div>
          <button class="btn btn-secondary btn-sm" onclick="loadTopups()">🔄 تحديث</button>
        </div>
        <div class="table-card"><div id="topupsTable"><div class="loading">جاري التحميل...</div></div></div>
      </div>

    </main>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="/theme.js"></script>
<script>
const API_BASE = window.location.origin;
let API_KEY = "";
let allOrders = [];
let allUsers = [];

async function apiFetch(path, options={}) {
  try {
    const sep = path.includes("?")?"&":"?";
    const url = API_BASE+path+sep+"key="+encodeURIComponent(API_KEY);
    const res = await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
    return res.json();
  } catch(e){return{error:e.message};}
}

async function doLogin(){
  const key=document.getElementById("apiKeyInput").value.trim();
  if(!key)return;
  API_KEY=key;
  const data=await apiFetch("/api/stats");
  if(data.error){document.getElementById("loginError").style.display="block";API_KEY="";}
  else{localStorage.setItem("admin_key",key);document.getElementById("loginScreen").style.display="none";document.getElementById("dashboard").style.display="block";initDashboard();}
}
function logout(){localStorage.removeItem("admin_key");location.reload();}
document.getElementById("apiKeyInput").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
const saved=localStorage.getItem("admin_key");
if(saved){API_KEY=saved;apiFetch("/api/stats").then(d=>{if(!d.error){document.getElementById("loginScreen").style.display="none";document.getElementById("dashboard").style.display="block";initDashboard();}else{localStorage.removeItem("admin_key");API_KEY="";}});}

function showPage(name,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
  document.getElementById("page-"+name).classList.add("active");
  btn.classList.add("active");
  if(name==="overview")loadOverview();
  if(name==="orders")loadOrders();
  if(name==="users")loadUsers();
  if(name==="balance")loadBalanceForm();
  if(name==="topups")loadTopups();
}
function initDashboard(){loadOverview();}

async function loadOverview(){
  const [stats,orders]=await Promise.all([apiFetch("/api/stats"),apiFetch("/api/orders")]);
  const pending=(orders||[]).filter(o=>o.status==="pending").length;
  document.getElementById("statsGrid").innerHTML=`
    <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-label">المستخدمون</div><div class="stat-value">${stats.totalUsers??0}</div></div>
    <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-label">الطلبات الكلية</div><div class="stat-value">${stats.totalOrders??0}</div></div>
    <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-label">طلبات معلقة</div><div class="stat-value">${pending}</div></div>
    <div class="stat-card"><div class="stat-icon">🎮</div><div class="stat-label">الألعاب</div><div class="stat-value">${stats.totalGames??0}</div></div>`;
  if(!orders||!orders.length){document.getElementById("recentOrders").innerHTML=`<div class="loading">لا توجد طلبات بعد</div>`;return;}
  document.getElementById("recentOrders").innerHTML=`<table><thead><tr><th>#</th><th>المستخدم</th><th>اللعبة</th><th>الليفلات</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${orders.slice(0,10).map(o=>`<tr>
      <td><code style="font-size:12px">#${o.id}</code></td>
      <td><strong>${o.first_name}</strong>${o.username?` @${o.username}`:""}</td>
      <td>${o.emoji} ${o.game_name}</td>
      <td>${o.levels}</td>
      <td><span class="status-badge status-${o.status}">${o.status==="completed"?"✅ مكتمل":"⏳ معلق"}</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="openOrder(${o.id})">ختم</button></td>
    </tr>`).join("")}
  </tbody></table>`;
}

async function loadOrders(){
  allOrders=await apiFetch("/api/orders");
  renderOrders(allOrders);
}
function renderOrders(orders){
  if(!orders||!orders.length){document.getElementById("ordersTable").innerHTML=`<div class="loading">لا توجد طلبات</div>`;return;}
  document.getElementById("ordersTable").innerHTML=`<table><thead><tr><th>#</th><th>المستخدم</th><th>اللعبة</th><th>الليفلات</th><th>الحالة</th><th>التاريخ</th><th></th></tr></thead><tbody>
    ${orders.map(o=>`<tr>
      <td><code style="font-size:12px">#${o.id}</code></td>
      <td><strong>${o.first_name}</strong>${o.username?` <span style="color:var(--text-muted)">@${o.username}</span>`:""}</td>
      <td>${o.emoji} ${o.game_name}</td>
      <td style="font-size:12px">${o.levels}</td>
      <td><span class="status-badge status-${o.status}">${o.status==="completed"?"✅ مكتمل":"⏳ معلق"}</span></td>
      <td style="color:var(--text-muted);font-size:12px">${fmt(o.created_at)}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="openOrder(${o.id})">🎯 ختم</button></td>
    </tr>`).join("")}
  </tbody></table>`;
}
function filterOrders(){
  const q=document.getElementById("orderSearch").value.toLowerCase();
  renderOrders(allOrders.filter(o=>o.first_name.toLowerCase().includes(q)||o.game_name.toLowerCase().includes(q)||(o.username&&o.username.toLowerCase().includes(q))||String(o.id).includes(q)));
}

async function openOrder(orderId){
  const [order,levels]=await Promise.all([
    apiFetch("/api/orders").then(orders=>(orders||[]).find(o=>o.id===orderId)),
    apiFetch(`/api/orders/${orderId}/levels`)
  ]);
  if(!order)return;
  document.getElementById("modalTitle").innerHTML=`${order.emoji} ${order.game_name} — طلب #${orderId}`;
  document.getElementById("modalBody").innerHTML=`
    <div class="info-grid">
      <div class="info-item"><div class="info-key">👤 المستخدم</div><div class="info-val">${order.first_name}${order.username?` (@${order.username})`:""}</div></div>
      <div class="info-item"><div class="info-key">📱 IDFA</div><div class="info-val">${order.idfa||"—"}</div></div>
      <div class="info-item"><div class="info-key">📱 IDFV</div><div class="info-val">${order.idfv||"—"}</div></div>
      <div class="info-item"><div class="info-key">🍎 iOS</div><div class="info-val">${order.ios_version||"—"}</div></div>
      <div class="info-item"><div class="info-key">📊 AppsFlyer ID</div><div class="info-val">${order.appsflyer_id||"—"}</div></div>
      <div class="info-item"><div class="info-key">📅 التاريخ</div><div class="info-val">${fmt(order.created_at)}</div></div>
    </div>
    <div style="font-size:13px;font-weight:600;margin-bottom:var(--space-2)">🎯 الليفلات — اضغط لختم:</div>
    <div class="levels-grid" id="levelsGrid">
      ${levels.map(l=>`
        <button class="level-btn ${l.stamped?'stamped':''}" 
          onclick="${l.stamped?'':`stampLevel(${orderId},${l.level},this)`}"
          title="${l.stamped?`✅ تم الختم: ${fmt(l.stamped_at)}`:'اضغط لختم'}">
          ${l.stamped?'✅':''} ليفل ${l.level}
        </button>`).join("")}
    </div>`;
  document.getElementById("modalActions").innerHTML=`<button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>`;
  openModal();
}

async function stampLevel(orderId,level,btn){
  btn.disabled=true;
  btn.textContent="⏳...";
  const res=await apiFetch("/api/stamp-level",{method:"POST",body:JSON.stringify({orderId,level})});
  if(res.error){showToast(`❌ ${res.error}`);btn.disabled=false;btn.textContent=`ليفل ${level}`;}
  else{
    btn.className="level-btn stamped";
    btn.textContent=`✅ ليفل ${level}`;
    showToast(res.orderComplete?"🎉 الطلب مكتمل بالكامل!":"✅ تم الختم وإرسال الإشعار!");
    if(res.orderComplete)loadOrders();
  }
}

async function loadUsers(){
  allUsers=await apiFetch("/api/users");
  renderUsers(allUsers);
}
function renderUsers(users){
  if(!users||!users.length){document.getElementById("usersTable").innerHTML=`<div class="loading">لا يوجد مستخدمون</div>`;return;}
  document.getElementById("usersTable").innerHTML=`<table><thead><tr><th>الاسم</th><th>يوزرنيم</th><th>Telegram ID</th><th>الطلبات</th><th>الرصيد</th><th></th></tr></thead><tbody>
    ${users.map(u=>`<tr>
      <td><strong>${u.first_name}</strong></td>
      <td style="color:var(--text-muted)">${u.username?`@${u.username}`:"—"}</td>
      <td><code style="font-size:12px;background:var(--surface-secondary);padding:2px 6px;border-radius:4px">${u.tg_id}</code></td>
      <td><span class="badge">${u.total_orders} طلب</span></td>
      <td><span class="balance-badge">💵 $${Number(u.balance||0).toFixed(2)}</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="quickBalance(${u.tg_id},'${u.first_name}',${u.balance||0})" style="color:var(--green-700)">+ رصيد</button></td>
    </tr>`).join("")}
  </tbody></table>`;
}
function filterUsers(){
  const q=document.getElementById("userSearch").value.toLowerCase();
  renderUsers(allUsers.filter(u=>u.first_name.toLowerCase().includes(q)||(u.username&&u.username.toLowerCase().includes(q))||String(u.tg_id).includes(q)));
}

function quickBalance(tgId,name,currentBalance){
  document.getElementById("modalTitle").textContent=`💵 إضافة رصيد لـ ${name}`;
  document.getElementById("modalBody").innerHTML=`
    <p style="color:var(--text-muted);margin-bottom:var(--space-4)">الرصيد الحالي: <strong>$${Number(currentBalance).toFixed(2)}</strong></p>
    <div class="form-group">
      <label class="form-label">المبلغ</label>
      <input type="number" class="input" id="quickAmount" placeholder="5.00" step="0.01"/>
      <div class="quick-btns" style="margin-top:var(--space-2)">
        <button class="quick-btn" onclick="document.getElementById('quickAmount').value=1">+$1</button>
        <button class="quick-btn" onclick="document.getElementById('quickAmount').value=5">+$5</button>
        <button class="quick-btn" onclick="document.getElementById('quickAmount').value=10">+$10</button>
        <button class="quick-btn" onclick="document.getElementById('quickAmount').value=20">+$20</button>
        <button class="quick-btn" onclick="document.getElementById('quickAmount').value=50">+$50</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظة</label>
      <input type="text" class="input" id="quickNote" placeholder="مثال: مكافأة"/>
    </div>`;
  document.getElementById("modalActions").innerHTML=`
    <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
    <button class="btn btn-primary" onclick="submitQuickBalance(${tgId})">💵 إضافة</button>`;
  openModal();
}
async function submitQuickBalance(tgId){
  const amount=parseFloat(document.getElementById("quickAmount").value);
  const note=document.getElementById("quickNote").value.trim();
  if(isNaN(amount)||amount===0){showToast("⚠️ أدخل مبلغاً صحيحاً");return;}
  const res=await apiFetch("/api/balance",{method:"POST",body:JSON.stringify({tgId,amount,note:note||undefined})});
  if(res.error)showToast(`❌ ${res.error}`);
  else{showToast(`✅ الرصيد الجديد: $${res.newBalance.toFixed(2)}`);closeModal();loadUsers();}
}

async function loadBalanceForm(){
  const users=await apiFetch("/api/users");
  document.getElementById("balanceUser").innerHTML=`<option value="">-- اختر مستخدم --</option>`+users.map(u=>`<option value="${u.tg_id}" data-balance="${u.balance||0}">${u.first_name}${u.username?` (@${u.username})`:""}</option>`).join("");
  document.getElementById("currentBalanceDisplay").textContent="";
}
function showUserBalance(){
  const sel=document.getElementById("balanceUser");
  const opt=sel.options[sel.selectedIndex];
  if(!opt.value){document.getElementById("currentBalanceDisplay").textContent="";return;}
  document.getElementById("currentBalanceDisplay").textContent=`💵 الرصيد الحالي: $${parseFloat(opt.dataset.balance||0).toFixed(2)}`;
}
function setAmount(val){document.getElementById("balanceAmount").value=val;}
async function doAddBalance(){
  const tgId=Number(document.getElementById("balanceUser").value);
  const amount=parseFloat(document.getElementById("balanceAmount").value);
  const note=document.getElementById("balanceNote").value.trim();
  if(!tgId){showToast("⚠️ اختر مستخدماً");return;}
  if(isNaN(amount)||amount===0){showToast("⚠️ أدخل مبلغاً صحيحاً");return;}
  const res=await apiFetch("/api/balance",{method:"POST",body:JSON.stringify({tgId,amount,note:note||undefined})});
  if(res.error)showToast(`❌ ${res.error}`);
  else{showToast(`✅ تم! الرصيد الجديد: $${res.newBalance.toFixed(2)}`);document.getElementById("balanceAmount").value="";document.getElementById("balanceNote").value="";loadBalanceForm();}
}


async function loadTopups(){
  const topups=await apiFetch("/api/topups");
  if(!topups||!topups.length){document.getElementById("topupsTable").innerHTML=`<div class="loading">لا توجد طلبات شحن</div>`;return;}
  document.getElementById("topupsTable").innerHTML=`<table><thead><tr><th>#</th><th>المستخدم</th><th>الطريقة</th><th>المبلغ</th><th>الإثبات</th><th>الحالة</th><th>التاريخ</th><th></th></tr></thead><tbody>
    ${topups.map(t=>`<tr>
      <td><code style="font-size:12px">#${t.id}</code></td>
      <td><strong>${t.first_name}</strong>${t.username?` @${t.username}`:""}</td>
      <td>${t.method==="syriatel"?"📱 سيريتيل":"🔐 USDT"}</td>
      <td><strong>$${t.amount}</strong></td>
      <td>${t.photo_id
        ?`<a href="/api/photo/${t.photo_id}?key=${API_KEY}" target="_blank" class="btn btn-ghost btn-sm">📸 صورة</a>`
        :t.tx_id?`<code style="font-size:11px">${t.tx_id}</code>`:"—"}</td>
      <td><span class="status-badge status-${t.status==="approved"?"completed":t.status==="rejected"?"rejected":"pending"}">${t.status==="approved"?"✅ مقبول":t.status==="rejected"?"❌ مرفوض":"⏳ معلق"}</span></td>
      <td style="color:var(--text-muted);font-size:12px">${fmt(t.created_at)}</td>
      <td style="display:flex;gap:4px">${t.status==="pending"?`
        <button class="btn btn-sm" style="background:#d1fae5;color:#065f46;border:none" onclick="approveTopup(${t.id},'${t.amount}')">✅ قبول</button>
        <button class="btn btn-sm" style="background:#fee2e2;color:#991b1b;border:none" onclick="rejectTopup(${t.id})">❌ رفض</button>
      `:"—"}</td>
    </tr>`).join("")}
  </tbody></table>`;
}

async function approveTopup(id, suggestedAmount){
  const amount=prompt(`المبلغ بالدولار للإضافة:`, suggestedAmount||"");
  if(!amount||isNaN(Number(amount)))return;
  const res=await apiFetch(`/api/topups/${id}/approve`,{method:"POST",body:JSON.stringify({amount:Number(amount)})});
  if(res.error)showToast(`❌ ${res.error}`);
  else{showToast(`✅ تم القبول وإضافة $${Number(amount).toFixed(2)}`);loadTopups();}
}

async function rejectTopup(id){
  if(!confirm("رفض طلب الشحن؟"))return;
  const res=await apiFetch(`/api/topups/${id}/reject`,{method:"POST",body:JSON.stringify({})});
  if(res.error)showToast(`❌ ${res.error}`);
  else{showToast("❌ تم الرفض وإشعار المستخدم");loadTopups();}
}

function openModal(){document.getElementById("modal").classList.add("open");}
function closeModal(){document.getElementById("modal").classList.remove("open");}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000);}
function fmt(s){if(!s)return"—";return new Date(s).toLocaleString("ar-SY",{dateStyle:"short",timeStyle:"short"});}
</script>
