services:
  - type: web
    name: game-stamp-bot
    runtime: node
    buildCommand: npm install -g bun && cd bot && bun install
    startCommand: cd bot && bun src/index.ts
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        value: mysecret123
      - key: PORT
        value: 3000
